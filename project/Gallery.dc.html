<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/tokens/fonts.css">
<link rel="stylesheet" href="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/tokens/colors.css">
<link rel="stylesheet" href="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/tokens/typography.css">
<link rel="stylesheet" href="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/tokens/spacing.css">
<link rel="stylesheet" href="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/styles.css">
<script src="_ds/claude-community-design-system-16a43eac-1e37-4f0d-9b10-6b2b1f286fd5/_ds_bundle.js"></script>
<style>
html,body{margin:0;padding:0;background:var(--ivory);}
a{color:var(--coral-deep);}a:hover{color:var(--coral);}
::selection{background:var(--coral-tint);}
[data-cc-theme="dark"]{--ivory:#1a1917;--ivory-2:#242320;--white:#242320;--ink:#faf9f5;--ink-70:rgba(250,249,245,.72);--ink-55:rgba(250,249,245,.6);--ink-12:rgba(250,249,245,.14);--coral-tint:#3c2b22;}
</style>
</helmet>
<div data-cc-theme="{{ theme }}" style="font-family:var(--font-sans);color:var(--ink);background:var(--ivory);min-height:100vh;transition:background .25s ease,color .25s ease;">

<nav style="display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:18px clamp(20px,5vw,64px);border-bottom:1px solid var(--ink-12);">
  <a href="Claude Community Cape Town.dc.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);">
    <img src="{{ sparkSrc }}" alt="" style="width:24px;height:24px;object-fit:contain;">
    <span style="display:flex;flex-direction:column;line-height:1.2;">
      <span style="font-family:var(--font-sans-display);font-weight:600;font-size:11px;letter-spacing:.09em;">CLAUDE COMMUNITY</span>
      <span style="font-family:var(--font-serif-display);font-weight:300;font-size:17px;">Cape Town</span>
    </span>
  </a>
  <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;font-size:14px;">
    <a href="Events.dc.html" style="color:var(--ink);text-decoration:none;" style-hover="color:var(--coral);">Events</a>
    <a href="Gallery.dc.html" style="color:var(--coral-deep);text-decoration:none;font-weight:600;">Gallery</a>
    <a href="Demos.dc.html" style="color:var(--ink);text-decoration:none;" style-hover="color:var(--coral);">Demos</a>
    <a href="Speak.dc.html" style="color:var(--ink);text-decoration:none;" style-hover="color:var(--coral);">Speak</a>
    <button onClick="{{ toggleTheme }}" style="border:1.5px solid var(--ink-12);background:transparent;color:var(--ink);border-radius:999px;height:34px;padding:0 14px;font-family:var(--font-sans);font-size:13px;cursor:pointer;" style-hover="border-color:var(--coral);color:var(--coral);">{{ themeLabel }}</button>
    <a href="Join.dc.html" style="text-decoration:none;">
      <x-import component-from-global-scope="ClaudeCommunityDesignSystem_16a43e.Button" size="sm" hint-size="72px,34px">Join</x-import>
    </a>
  </div>
</nav>

<header data-screen-label="Gallery header" style="padding:clamp(48px,6vw,80px) clamp(20px,5vw,64px) 24px;">
  <div style="max-width:1200px;margin:0 auto;">
    <p style="margin:0 0 10px;font-family:var(--font-sans-display);font-weight:600;font-size:11px;letter-spacing:.09em;color:var(--coral);">GALLERY</p>
    <h1 style="margin:0 0 8px;font-family:var(--font-serif-display);font-weight:300;font-size:clamp(36px,5vw,64px);">Thank you, Cape Town</h1>
    <p style="margin:0;font-size:16px;color:var(--ink-70);">Moments from our meetups.</p>
  </div>
</header>

<section data-screen-label="Kickoff Build gallery" style="padding:24px clamp(20px,5vw,64px) clamp(56px,7vw,96px);">
  <div style="max-width:1200px;margin:0 auto;">
    <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:24px;">
      <h2 style="margin:0;font-family:var(--font-serif-display);font-weight:300;font-size:clamp(26px,3vw,36px);">Claude Kickoff Build</h2>
      <span style="font-family:var(--font-mono);font-size:13px;color:var(--ink-55);">27 August 2026 · Cape Town</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;grid-auto-rows:240px;grid-auto-flow:dense;">
      <a href="assets/gallery/kickoff-01.jpg" style="display:block;grid-column:1/-1;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-01.jpg" alt="Opening talk at the Claude Kickoff Build" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-08.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-08.jpg" alt="Cape Town title slide" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-04.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-04.jpg" alt="Claude Butter cookie bags" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-02.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-02.jpg" alt="Speaker introduction" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-05.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-05.jpg" alt="Speaker with microphone" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-03.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-03.jpg" alt="Audience watching a talk" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-06.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-06.jpg" alt="Sliders at the snack table" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
      <a href="assets/gallery/kickoff-07.jpg" style="display:block;border-radius:14px;overflow:hidden;min-width:0;"><img src="assets/gallery/kickoff-07.jpg" alt="Speaker lineup on screen" style="width:100%;height:100%;object-fit:cover;display:block;" style-hover="opacity:.9;"></a>
    </div>
  </div>
</section>

<footer style="background:#141413;color:rgba(250,249,245,.75);padding:24px clamp(20px,5vw,64px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;">
  <span>© 2026 Claude Community Cape Town. A community initiative. Not affiliated with Anthropic.</span>
  <a href="Claude Community Cape Town.dc.html" style="color:#faf9f5;">← Back home</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: (typeof localStorage !== "undefined" && localStorage.getItem("cc-theme")) || "light" };
  renderVals() {
    const dark = this.state.theme === "dark";
    return {
      theme: this.state.theme,
      themeLabel: dark ? "Light mode" : "Dark mode",
      sparkSrc: dark ? "assets/spark-ivory.png" : "assets/spark-ink.png",
      toggleTheme: () => {
        const t = dark ? "light" : "dark";
        try { localStorage.setItem("cc-theme", t); } catch (e) {}
        this.setState({ theme: t });
      },
    };
  }
}
</script>
</body>
</html>
